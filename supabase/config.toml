project_id = "hotel-pms"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# The reset email sends people to <origin>/reset-password, and Supabase will
# only redirect to an address on this list — anything else silently falls back
# to site_url, which drops the token and makes the link look broken. The
# wildcards cover that path for local development. The hosted project keeps its
# own list under Auth -> URL Configuration and needs the deployed origin added
# there too.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
jwt_expiry = 3600
enable_signup = false

# THE RESET LINK CARRIES A TOKEN HASH, NOT A PKCE CODE. The default template
# links to {{ .ConfirmationURL }}, which comes back as ?code= and can only be
# exchanged in the browser that asked -- the verifier lives in that browser's
# cookies. A receptionist who asks at the desk and opens the email on a phone
# would get a dead link. /reset-password verifies ?token_hash= with
# verifyOtp(), which works anywhere. The hosted project needs the same
# template pasted under Auth -> Email Templates -> Reset Password, and its Site
# URL set to the deployed origin, which is what {{ .SiteURL }} fills in.
[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"
